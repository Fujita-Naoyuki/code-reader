[package]
name = "code-reader"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arboard = "3.6.1"
eframe = "0.34.2"
egui_extras = { version = "=0.34.2", features = ["svg", "svg_text"] }
fuzzy-matcher = "0.3.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ignore = "0.4.25"
markdown = "1.0.0"
mmdflux = "=2.5.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
tree-sitter = "0.26.9"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "0.24.2"
webbrowser = "1.2.1"

[profile.release]
strip = true
lto = true

[dev-dependencies]
egui_kittest = { version = "=0.34.2", features = ["eframe"] }
tempfile = "3"
